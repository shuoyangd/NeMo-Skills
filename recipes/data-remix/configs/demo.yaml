cluster: local
base_output_dir: /workspace/data-remix-demo
expname: data-remix
suffix: demo

pipeline_stages:
  - separate_data
  - remix_data
  - convert_to_sft

directories:
  step-1-separate: ${base_output_dir}/step-1-separate
  step-2-remix:    ${base_output_dir}/step-2-remix
  step-3-sft:      ${base_output_dir}/step-3-sft

stages:
  separate_data:
    input_file: /path/to/input.jsonl
    output_dir: ${directories.step-1-separate}
    # Regex matched against metadata.domain; instances that match go to target
    domain_regex: "^math"
    dependencies: null

  remix_data:
    target_file:     ${directories.step-1-separate}/target.jsonl
    non_target_file: ${directories.step-1-separate}/non_target.jsonl
    output_dir:      ${directories.step-2-remix}
    # Single ratio or a list — a separate output file is produced for each
    target_ratio:
      - 0.2
      - 0.3
      - 0.5
    seed: 42
    dependencies:
      - separate_data

  convert_to_sft:
    input_dir:  ${directories.step-2-remix}
    output_dir: ${directories.step-3-sft}
    model: ???  # required: HuggingFace model name or path, e.g. nvidia/NVIDIA-Nemotron-3-Nano-30B-A3B-BF16
    # Optional overrides (all default to oai_to_sft.py defaults if omitted):
    # reasoning_open:    ""       # e.g. "[THINK]" for Mistral Reasoning
    # reasoning_close:   ""       # e.g. "[/THINK]"
    # thinking_start:    "<think>\n"
    # thinking_placement: input   # input | output | best-effort-input
    # default_system:    ""       # set to null to use --no-default-system
    dependencies:
      - remix_data
